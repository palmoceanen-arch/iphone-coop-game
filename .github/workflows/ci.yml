name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Smoke-test server boot
        run: |
          node server/index.js &
          SERVER_PID=$!
          # Wait up to 10s for /healthz to return 200.
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:3000/healthz > /dev/null; then
              echo "Server is up"
              kill $SERVER_PID
              exit 0
            fi
            sleep 0.5
          done
          echo "Server did not respond in time" >&2
          kill $SERVER_PID || true
          exit 1
