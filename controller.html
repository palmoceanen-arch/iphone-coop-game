<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0c0f17" />
    <title>Twin Hearts — Controller</title>
    <style>
      :root { color-scheme: dark; }
      * {
        box-sizing: border-box;
        user-select: none;
        -webkit-user-select: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        touch-action: none;
      }
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        position: fixed; inset: 0;
        background: radial-gradient(ellipse at top, #1a2236 0%, #0c0f17 60%);
        color: #e0e6f3;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        overflow: hidden;
        overscroll-behavior: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        touch-action: none;
      }
      input.codeinput { -webkit-user-select: text; user-select: text; touch-action: manipulation; }
      #lobby, #controller {
        position: absolute; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        padding: env(safe-area-inset-top, 16px) 16px env(safe-area-inset-bottom, 16px);
      }
      #controller { display: none; }
      h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: 0.5px; }
      .sub { color: #9aa6c0; font-size: 14px; margin-bottom: 24px; text-align: center; max-width: 320px; }
      .codeinput {
        width: 220px;
        padding: 16px;
        font-size: 32px;
        text-align: center;
        letter-spacing: 8px;
        text-transform: uppercase;
        background: #1a2030;
        color: #e0e6f3;
        border: 2px solid #2a3550;
        border-radius: 12px;
        outline: none;
        margin-bottom: 14px;
      }
      .codeinput:focus { border-color: #6ad0ff; }
      .btn {
        background: linear-gradient(180deg, #3a83d0 0%, #2563b0 100%);
        color: white;
        padding: 14px 28px;
        border-radius: 12px;
        border: none;
        font-size: 18px;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
        margin-top: 6px;
      }
      .btn:disabled { opacity: 0.5; }
      .err { color: #ff8a8a; margin-top: 10px; font-size: 14px; min-height: 1.2em; }

      /* Controller surface */
      #controller .badge {
        position: absolute; top: max(env(safe-area-inset-top, 0px), 12px); left: 50%;
        transform: translateX(-50%);
        padding: 6px 16px;
        border-radius: 999px;
        background: rgba(20, 28, 48, 0.85);
        border: 1px solid rgba(255,255,255,0.12);
        font-weight: 600;
        font-size: 14px;
        z-index: 5;
      }
      #controller .badge .p { color: var(--p1); }
      #controller .status {
        position: absolute; top: max(env(safe-area-inset-top, 0px), 50px); left: 50%;
        transform: translateX(-50%);
        font-size: 12px; color: #8e9bb8;
      }
      .joystick {
        position: absolute;
        bottom: max(env(safe-area-inset-bottom, 0px), 32px);
        left: 24px;
        width: 180px; height: 180px;
        border-radius: 50%;
        background: rgba(255,255,255,0.06);
        border: 2px solid rgba(255,255,255,0.12);
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        touch-action: none;
      }
      .joystick .knob {
        position: absolute; top: 50%; left: 50%;
        width: 70px; height: 70px;
        border-radius: 50%;
        margin: -35px 0 0 -35px;
        background: radial-gradient(circle at 35% 35%, #ffffff 0%, #b8c4dd 70%);
        box-shadow: 0 6px 14px rgba(0,0,0,0.45);
        pointer-events: none;
      }
      .actions {
        position: absolute;
        bottom: max(env(safe-area-inset-bottom, 0px), 32px);
        right: 24px;
        display: flex; flex-direction: column; gap: 14px;
      }
      .action {
        width: 92px; height: 92px;
        border-radius: 50%;
        border: 2px solid rgba(255,255,255,0.18);
        background: linear-gradient(180deg, rgba(255,255,255,0.16) 0%, rgba(255,255,255,0.04) 100%);
        color: #fff;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.5px;
        display: flex; align-items: center; justify-content: center;
        touch-action: none;
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
      }
      .action.attack { background: linear-gradient(180deg, rgba(255,138,138,0.55) 0%, rgba(220,80,80,0.4) 100%); border-color: rgba(255,138,138,0.6); }
      .action.dash { background: linear-gradient(180deg, rgba(106,208,255,0.55) 0%, rgba(60,148,200,0.4) 100%); border-color: rgba(106,208,255,0.6); }
      .action.shop { background: linear-gradient(180deg, rgba(255,209,102,0.55) 0%, rgba(212,160,42,0.4) 100%); border-color: rgba(255,209,102,0.6); width: 60px; height: 60px; font-size: 22px; }
      .action.ability {
        position: absolute;
        right: 132px;
        bottom: max(env(safe-area-inset-bottom, 0px), 138px);
        width: 78px; height: 78px;
        background: linear-gradient(180deg, rgba(173,138,255,0.55) 0%, rgba(126,86,212,0.4) 100%);
        border-color: rgba(173,138,255,0.6);
        font-size: 28px;
        z-index: 3;
      }
      .action.ability.empty { opacity: 0.35; filter: grayscale(0.6); }
      .action.ability.cooling { opacity: 0.7; }
      .action.ability .ab-cd-text {
        position: absolute; inset: 0;
        display: flex; align-items: center; justify-content: center;
        font-size: 18px; font-weight: 800;
        text-shadow: 0 1px 3px #000;
        pointer-events: none;
      }
      .action.ability .ab-cd-svg {
        position: absolute; inset: 0;
        width: 100%; height: 100%;
        pointer-events: none;
      }
      .action.ability .ab-cd-svg circle {
        fill: none;
        stroke: rgba(0,0,0,0.55);
        stroke-width: 6;
        transform: rotate(-90deg);
        transform-origin: 50% 50%;
        transition: stroke-dashoffset 0.05s linear;
      }
      .action.interact {
        position: absolute;
        right: 132px;
        bottom: max(env(safe-area-inset-bottom, 0px), 60px);
        width: 76px; height: 76px;
        border-radius: 50%;
        border: 2px solid rgba(255,209,102,0.85);
        background: linear-gradient(180deg, rgba(255,221,138,0.85) 0%, rgba(218,166,52,0.7) 100%);
        color: #1a1206;
        font-size: 28px;
        font-weight: 800;
        display: none;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 18px rgba(255,209,102,0.55), 0 4px 12px rgba(0,0,0,0.45);
        animation: pulseInteract 1.2s ease-in-out infinite;
        touch-action: none;
        z-index: 4;
      }
      .action.interact.show { display: flex; }
      .action.interact.pressed { transform: scale(0.9); filter: brightness(1.3); }
      .action.interact .label {
        position: absolute;
        right: 100%;
        top: 50%;
        transform: translate(-10px, -50%);
        white-space: nowrap;
        background: rgba(20, 28, 48, 0.92);
        color: #e0e6f3;
        font-size: 12px;
        font-weight: 600;
        padding: 4px 10px;
        border-radius: 8px;
        border: 1px solid rgba(255,209,102,0.5);
        pointer-events: none;
      }
      @keyframes pulseInteract {
        0%, 100% { box-shadow: 0 0 18px rgba(255,209,102,0.55), 0 4px 12px rgba(0,0,0,0.45); }
        50% { box-shadow: 0 0 28px rgba(255,209,102,0.85), 0 4px 16px rgba(0,0,0,0.45); }
      }
      .item-bar {
        position: absolute;
        top: max(env(safe-area-inset-top, 0px), 110px);
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
        max-width: min(86vw, 480px);
        justify-content: center;
        pointer-events: none;
      }
      .item-bar .item-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 26px; height: 26px;
        padding: 0 5px;
        background: rgba(20, 28, 48, 0.9);
        border: 1px solid rgba(255,255,255,0.18);
        border-radius: 5px;
        font-size: 14px;
        gap: 2px;
        color: #e0e6f3;
      }
      .item-bar .item-icon[data-rar="uncommon"] { border-color: #66d97a; box-shadow: 0 0 6px rgba(102,217,122,0.45); }
      .item-bar .item-icon[data-rar="rare"] { border-color: #6aa6ff; box-shadow: 0 0 8px rgba(106,166,255,0.55); }
      .item-bar .item-icon[data-rar="legendary"] { border-color: #ffb84d; box-shadow: 0 0 10px rgba(255,184,77,0.7); }
      .item-bar .item-icon .count { font-size: 11px; color: #cbd5ee; opacity: 0.85; }
      .action.pressed { transform: scale(0.92); filter: brightness(1.4); }
      .hint {
        position: absolute; top: 50%; left: 50%;
        transform: translate(-50%, -50%);
        text-align: center; color: #6e7a96; font-size: 13px;
        max-width: 280px; pointer-events: none;
      }
      .stats {
        position: absolute; top: max(env(safe-area-inset-top, 0px), 78px); left: 50%;
        transform: translateX(-50%);
        display: flex; gap: 14px; align-items: center;
        font-size: 13px; color: #c0cce8;
      }
      .stats .gold { color: #ffd166; font-weight: 700; }
      .stats .hp { color: #ff8a8a; font-weight: 700; }
      .stats .dmg { color: #ffe28a; }
      .shop-overlay {
        position: absolute; inset: 0;
        background: rgba(8, 11, 18, 0.96);
        z-index: 50;
        display: none;
        flex-direction: column;
        padding: max(env(safe-area-inset-top, 0px), 18px) 18px max(env(safe-area-inset-bottom, 0px), 18px);
        overflow-y: auto;
        touch-action: pan-y;
      }
      .shop-overlay.open { display: flex; }
      .shop-overlay h2 { margin: 0 0 8px; font-size: 22px; }
      .shop-overlay .top {
        display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;
      }
      .shop-overlay .gold { color: #ffd166; font-weight: 800; font-size: 18px; }
      .shop-overlay .close-btn {
        background: rgba(255,255,255,0.08);
        color: #e0e6f3; padding: 8px 14px; border: 1px solid rgba(255,255,255,0.18);
        border-radius: 10px; font-size: 14px;
      }
      .upg-row {
        display: grid; grid-template-columns: 1fr auto;
        gap: 8px; align-items: center;
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 14px; padding: 12px 14px;
        margin-bottom: 10px;
      }
      .upg-row.locked { opacity: 0.45; }
      .upg-row .name { font-weight: 700; font-size: 15px; }
      .upg-row .desc { color: #8a96b6; font-size: 12px; margin-top: 2px; }
      .upg-row .lvl { color: #6ad0ff; font-weight: 600; font-size: 12px; }
      .upg-row .price-btn {
        background: linear-gradient(180deg, #d4a02a 0%, #a87a17 100%);
        color: #1a1206; font-weight: 800;
        border: none; border-radius: 12px;
        padding: 10px 14px; font-size: 14px;
        min-width: 78px; text-align: center;
        touch-action: manipulation;
      }
      .upg-row.locked .price-btn { background: #2a3142; color: #6e7a96; }
      :root { --p1: #6ad0ff; --p2: #ff8a8a; }
      #controller.p1 .badge .p { color: var(--p1); }
      #controller.p2 .badge .p { color: var(--p2); }
    </style>
  </head>
  <body>
    <div id="lobby">
      <h1>Twin Hearts</h1>
      <div class="sub">Введи 4-значный код, отображённый на экране ноутбука/телевизора, чтобы подключить контроллер.</div>
      <input id="code" class="codeinput" autocomplete="off" autocapitalize="characters" inputmode="text" maxlength="4" placeholder="ABCD" />
      <button id="join" class="btn">Подключиться</button>
      <div id="err" class="err"></div>
    </div>

    <div id="controller">
      <div class="badge">Игрок <span class="p">?</span> · комната <span id="roomcode">····</span></div>
      <div class="status" id="status">Жди старта игры…</div>
      <div class="stats">
        <span class="hp">♥ <span id="stHp">100</span>/<span id="stMaxHp">100</span></span>
        <span class="gold">⛁ <span id="stGold">0</span></span>
        <span class="dmg">⚔ <span id="stDmg">0</span></span>
      </div>
      <div class="joystick" id="stick"><div class="knob" id="knob"></div></div>
      <div class="item-bar" id="itemBar"></div>
      <div class="actions">
        <div class="action attack" id="btnAttack">⚔</div>
        <div class="action dash" id="btnDash">⇢</div>
        <div class="action shop" id="btnShop">⛁</div>
      </div>
      <div class="action ability empty" id="btnAbility">
        <span class="ab-icon">·</span>
        <svg class="ab-cd-svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" stroke-dasharray="276.46" stroke-dashoffset="0"/></svg>
        <span class="ab-cd-text"></span>
      </div>
      <div class="action interact" id="btnInteract">
        <span class="label" id="interactLabel">Взять</span>
        ✋
      </div>
      <div class="hint" id="hint">Левый стик — движение · ⚔ удар · ⇢ рывок · ✦ способность · ⛁ магазин</div>

      <div class="shop-overlay" id="shopOverlay">
        <div class="top">
          <h2>Магазин</h2>
          <button class="close-btn" id="shopClose">Закрыть</button>
        </div>
        <div style="margin-bottom: 12px;">
          ❤ <span id="shopHp">100</span>/<span id="shopMaxHp">100</span>
          &nbsp;·&nbsp;
          <span class="gold">⛁ <span id="shopGold">0</span></span>
        </div>
        <div id="shopList"></div>
      </div>
    </div>

    <script type="module" src="/src/controller.js"></script>
  </body>
</html>
